<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#BF531A">
  <title>PASAKJA — No connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #F6F4F1; color: #2B2118; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #6B5D52; line-height: 1.5; }
    button { padding: 12px 22px; border: 0; border-radius: 999px; background: #BF531A; color: #fff; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>No internet connection</h1>
    <p>PASAKJA needs a connection to book and track rides. Check your mobile data or Wi-Fi, then try again. In an emergency, call 911.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
